<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkControl - Iniciar sesión</title>
    <link rel="stylesheet" href="estilos.css">

</head>
<body>
    <main class="contenedor">
    
<img src="ParkControl.png" alt="Logo de ParkControl" class="logo"> 

<h1>Bienvenido</h1>
<h2>Sistema de gestión de parqueaderos</h2>


<section class="tarjeta">

    <form>
        <label for="usuario">Ingrese su usuario:</label>
        <input
            id="usuario"
            name="usuario"
            type="email"
            placeholder="admin@urb.com"
            required
        >

        <label for="contrasena">Ingrese su contraseña:</label>
        <input
            id="contrasena"
            name="contrasena"
            type="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">Enviar</button>

        <a href="recuperar.html" class="recuperar">
            ¿Olvidó su contraseña?
        </a>
    </form>

</section>
        
      <hr>
     
    
<section class="informacion">
            <p>
                Manténgase informado sobre las últimas actualizaciones
                de control de parqueaderos en su copropiedad.
            </p>

            <ul>
                <li>Registro automático de visitantes.</li>
                <li>Reportes de uso de celdas en tiempo real.</li>
                <li>Alertas de seguridad integradas.</li>
            </ul>
        </section>
       </main>

    </body>
</html>
